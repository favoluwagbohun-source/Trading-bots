services:
  - type: web
    name: crypto-signal-platform
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SERVE_WEB_ASSETS
        value: "true"
      - key: WATCHLIST_SYMBOLS
        value: "BTCUSDT,ETHUSDT,SOLUSDT"
      - key: SCAN_INTERVAL_MS
        value: "30000"
      - key: PAPER_FEE_RATE_PER_SIDE
        value: "0.001"
      - key: PAPER_SLIPPAGE_RATE_PER_SIDE
        value: "0.001"
      - key: HEARTBEAT_ENABLED
        value: "true"
      - key: TELEGRAM_DEFAULT_CHAT_ID
        sync: false

