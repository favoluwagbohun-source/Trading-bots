name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: docker compose --env-file deploy/production.env.example config --quiet
      - run: docker build --target runtime -t trading-bots-runtime:ci .
      - run: docker build --target web -t trading-bots-web:ci .
